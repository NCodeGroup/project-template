# Keeps this repository's own CI inputs current: the actions in its workflow, and the Python packages its tests use,
# pinned in tests/requirements.txt. The pins inside template/ are in merged files, which each project's own Dependabot
# keeps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pip:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
