name: Release

# Tags and publishes each release as soon as its pull request merges. tools/Publish-Release.ps1 reads the newest section of
# CHANGELOG.md, which a plan's last step writes, and when origin has no tag for that version yet, tags the commit this
# push made main point to and publishes the GitHub release with that section as its notes. Nobody has to run /ship-plan
# after the merge for these, and it works for a plan landed from a Claude Code cloud session, whose GitHub proxy refuses
# a tag push and the GraphQL API `gh release create` uses. /ship-plan run after the merge finds the tag and the release
# done and skips them; it still closes the plan's issue and files its follow-ups.
#
# Only a push to main that changes CHANGELOG.md starts it, and main takes changes only through pull requests whose
# checks passed. To retry a run that failed, run it by hand (Actions > Release > Run workflow): it then tags the commit
# main points to at that time.
#
# The tag and the release are made with the workflow's GITHUB_TOKEN, so they start no other workflow; nothing in this
# repository runs on a tag or a release. Protect release tags lets the token create a v* tag but never move or delete one.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and a run is never cancelled partway, between its tag and its release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Keeps checkout's token in the clone's git config: the tag push uses it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag and publish the changelog's newest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./tools/Publish-Release.ps1 -Commit $env:GITHUB_SHA
