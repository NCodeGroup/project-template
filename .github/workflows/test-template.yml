name: Test template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "template/{% if stack == 'dotnet' %}global.json{% endif %}"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set a Git identity for Copier's update merge
        run: |
          git config --global user.name "template-test"
          git config --global user.email "template-test@example.invalid"
      - name: Test the template
        run: ./Test-Template.ps1
      - name: Test adopting existing repositories
        run: ./Test-Adoption.ps1
