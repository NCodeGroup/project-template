name: Test template

on:
  push:
    branches: [main]
  pull_request:
  # A required check must also report in a merge queue.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other event's group includes its commit, so a push to
# main, a merge queue entry and a manual run never cancel or replace another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Longest first, by CI's median suite time, so the longest jobs start before the concurrent-job limit makes the last ones wait.
        include:
          - name: Test the template
            run: ./tests/Test-Template.ps1
          - name: Test the template's .NET build
            run: ./tests/Test-TemplateDotnet.ps1
          - name: Test the plan state script
            run: ./tests/Test-PlanState.ps1
          - name: Test adopting existing repositories
            run: ./tests/Test-Adoption.ps1
          - name: Test the repository baseline script
            run: ./tests/Test-RepositoryBaseline.ps1
          - name: Test the test runner
            run: ./tests/Test-InvokeAllTests.ps1
          - name: Test the suggestion for a rewritten merged file
            run: ./tests/Test-UpdateRewrittenFiles.ps1
          - name: Test the template update notice
            run: ./tests/Test-TemplateUpdate.ps1
          - name: Analyze the PowerShell scripts
            run: ./tests/Test-ScriptAnalyzer.ps1
          - name: Test updating a rendered project
            run: ./tests/Test-ProjectUpdate.ps1
          - name: Test the update's hooks path and the root wrapper
            run: ./tests/Test-ProjectUpdateHooks.ps1
          - name: Test updating an adopted project's kept lines
            run: ./tests/Test-UpdateKeptLines.ps1
          - name: Test the update's exit code
            run: ./tests/Test-UpdateExitCode.ps1
          - name: Set up the address-feedback end-to-end fixture
            run: ./tests/e2e/Test-AddressFeedback.ps1 -SetupOnly
          - name: Test the Git hooks
            run: ./tests/Test-GitHooks.ps1
          - name: Test the commit attribution check
            run: ./tests/Test-CommitAttribution.ps1
          - name: Test updating a project that ignores a large folder
            run: ./tests/Test-UpdateIgnoredFiles.ps1
          - name: Test updating a project that owns a merged file
            run: ./tests/Test-UpdateOwnedFiles.ps1
          - name: Test adopting repositories with edge cases
            run: ./tests/Test-AdoptEdgeCases.ps1
          - name: Set up the run-issues end-to-end fixture for max-review-rounds
            run: ./tests/e2e/Test-RunIssues.ps1 -SetupOnly -Scenario max-rounds
          - name: Set up the run-issues end-to-end fixture
            run: ./tests/e2e/Test-RunIssues.ps1 -SetupOnly
          - name: Test adopting a repository that owns a merged file
            run: ./tests/Test-AdoptOwnedFiles.ps1
          - name: Test the changelog backfill check
            run: ./tests/Test-ChangelogBackfill.ps1
          - name: Check the changelog for duplicate headings
            run: ./tests/Test-ChangelogHeadings.ps1
          - name: Test the plan state script's concurrent calls
            run: ./tests/Test-PlanStateConcurrency.ps1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "template/{% if stack == 'dotnet' %}global.json{% endif %}"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Copier once, so the tests don't resolve it through uvx on every run
        run: |
          uv tool install copier
          uv tool dir --bin >> $env:GITHUB_PATH
      - name: Set a Git identity for Copier's update merge
        run: |
          git config --global user.name "template-test"
          git config --global user.email "template-test@example.invalid"
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # The ruleset requires a check named test: this job passes only when every suite passed.
  test:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every suite passed
        env:
          RESULT: ${{ needs.suite.result }}
        run: test "$RESULT" = success

  commit-attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit attribution
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: ./template/.template/Test-CommitAttribution.ps1 -Root . -Base $env:BASE -Head $env:HEAD
