# Copier template: a new repository set up for plan-then-execute AI coding.
# Use:    copier copy --vcs-ref <tag> <this repo> <destination>   (New-Project.ps1 wraps it)
# Update: .\.template\Update-Project.ps1, run in the project

_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

# Every file has one of three owners (the README's "What a Project Gets"):
# - Project-owned (_skip_if_exists): written once when the project is created; updates never touch them.
# - Merged (_merged_files): files whose tools can't include a second file. Updates merge the template's changes
#   with the project's edits, like a Git merge. .template\Update-Project.ps1 reads this list; Copier ignores it.
# - Template-owned: every other file. Updates replace it, discarding any edit.
_skip_if_exists:
  - AGENTS.md
  - README.md
  - Directory.Build.props
_merged_files:
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .vscode/settings.json
  - .vscode/extensions.json
  - .claude/settings.json
  - .github/workflows/ci.yml
  - .github/dependabot.yml
  - .gitlab-ci.yml
  - Directory.Packages.props
  - global.json

# The workflow files of tools the project doesn't use; an empty pattern excludes nothing.
# Each pattern reads workflow_tools through a default, because an update renders the old version's files with these patterns before the project has that answer.
_exclude:
  - "{% if 'claude' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}CLAUDE.md{% endif %}"
  - "{% if 'claude' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.claude{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/copilot-*.agent.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/plan-executor.agent.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/skills{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts/execute-step.prompt.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/hybrid-*.agent.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/local-implementer.agent.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts/execute-step-local.prompt.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) and 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts{% endif %}"

project_name:
  type: str
  help: Project name, used in headings (for example QSO Log Viewer)
  validator: "{% if not project_name.strip() %}Required{% endif %}"

project_description:
  type: str
  help: One-sentence description
  default: ""

stack:
  type: str
  help: Main language or platform
  choices:
    .NET (C#): dotnet
    Python: python
    Node.js or TypeScript: node
    PowerShell: powershell
    Other: other
  default: dotnet

git_host:
  type: str
  help: Where the repository is hosted
  choices:
    GitHub: github
    GitLab: gitlab
  default: github

workflow_tools:
  type: str
  help: The AI tools to set the workflow up for
  multiselect: true
  choices:
    Claude Code: claude
    GitHub Copilot (Copilot Chat and Copilot CLI): copilot
    Hybrid agents on the shack PC's local model (personal; leave out of shared repositories): local
  default: [claude, copilot, local]
  validator: "{% if not workflow_tools %}Choose at least one tool{% endif %}"

author_name:
  type: str
  help: Author and copyright holder for .NET assembly and package metadata
  default: Marcin Polewski
  when: "{{ stack == 'dotnet' }}"

nuget_package:
  type: bool
  help: "Publish the projects as NuGet packages: license, README and icon in each package, Source Link, symbol packages"
  default: false
  when: "{{ stack == 'dotnet' }}"

package_license:
  type: str
  help: SPDX license expression for the packages, such as MIT or Apache-2.0
  when: "{{ stack == 'dotnet' and nuget_package }}"
  validator: "{% if not package_license.strip() %}Required for a NuGet package{% endif %}"

package_icon:
  type: str
  help: "Package icon: a PNG file at the repository root, or blank for none"
  default: ""
  when: "{{ stack == 'dotnet' and nuget_package }}"
  validator: '{% if "/" in package_icon or "\\" in package_icon %}A file name at the repository root, without a folder{% endif %}'

package_manager:
  type: str
  help: The Node.js package manager, which CI installs dependencies with and the default commands run
  choices:
    npm: npm
    pnpm: pnpm
    Yarn: yarn
    Bun: bun
  default: npm
  when: "{{ stack == 'node' }}"

build_command:
  type: str
  help: Build command, run from the repository root in PowerShell (blank if there is no build step)
  default: >-
    {%- if stack == 'dotnet' -%}dotnet build
    {%- elif stack == 'node' -%}{{ package_manager | default('npm') }} run build
    {%- elif stack == 'powershell' -%}Invoke-ScriptAnalyzer -Path . -Recurse -EnableExit
    {%- endif -%}

test_command:
  type: str
  help: Test command, run from the repository root in PowerShell
  default: >-
    {%- if stack == 'dotnet' -%}dotnet test
    {%- elif stack == 'python' -%}python -m pytest -q
    {%- elif stack == 'node' -%}{{ package_manager | default('npm') }} run test
    {%- elif stack == 'powershell' -%}Invoke-Pester -CI
    {%- endif -%}

_message_after_copy: |
  Created {{ project_name }}. Next: open it through the shack PC's VS Code tunnel, review AGENTS.md, and plan the first change with /plan-feature in the Claude Code panel.
