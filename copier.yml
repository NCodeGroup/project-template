    docs/decisions/project-template/0146-secrets-are-never-logged-compared-in-constant-time-and-shown-once.md
    {% endif %}
  - |-
    {% if stack is defined and nuget_package is defined and not (stack == 'dotnet' and nuget_package) %}
    docs/decisions/project-template/0130-source-link-and-symbol-packages.md
    docs/decisions/project-template/0131-public-api-is-tracked-and-evolves-compatibly.md
    docs/decisions/project-template/0132-implementation-packages-depend-only-on-abstractions.md
    docs/decisions/project-template/0133-abstractions-are-framework-free-and-tiered.md
