# Copier template: a new repository set up for plan-then-execute AI coding.
# Use:    copier copy --vcs-ref <tag> <this repo> <destination>   (New-Project.ps1 wraps it)
# Update: .\.template\Update-Project.ps1, run in the project

_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

# Every file has one of three owners (the README's "What a Project Gets"):
# - Project-owned (_skip_if_exists): written once when the project is created; updates never touch them.
#   Each entry starts with /: Copier reads them like .gitignore patterns, and a name without a / matches that name in every folder.
# - Merged (_merged_files): files whose tools can't include a second file. Updates merge the template's changes
#   with the project's edits, like a Git merge. .template\Update-Project.ps1 reads this list; Copier ignores it.
# - Template-owned: every other file. Updates replace it, discarding any edit.
# A project that replaced a merged or template-owned file makes it project-owned with the project_owned_files answer, which can name any file the template renders except .copier-answers.yml, .template-version and the files in .template/; Adopt-Project.ps1 and .template\Update-Project.ps1 enforce it.
_skip_if_exists:
  - /AGENTS.md
  - /README.md
  - /.node-version
  - /Directory.Build.props
  - /.github/workflows/code-review.yml
  - /.github/workflows/publish.yml
  - /docs/decisions/README.md
  - /docs/decisions/0000-template.md
  - /LICENSE.txt
  - /COPYRIGHT.txt
  - /NCodeGroup.png
  - /SECURITY.md
  - /CONTRIBUTING.md
  - /docs/README.md
  - /docs/metrics.md
  - /docs/designs/_template.md
_merged_files:
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .vscode/settings.json
  - .vscode/extensions.json
  - .claude/settings.json
  - .github/workflows/ci.yml
  - .github/workflows/copilot-setup-steps.yml
  - .github/actions/install-dotnet/action.yml
  - .github/dependabot.yml
  - .gitlab-ci.yml
  - Directory.Packages.props
  - global.json
  - nuget.config

# The workflow files of tools the project doesn't use; an empty pattern excludes nothing.
# Each pattern reads its answer through a default or an `is defined` test, because an update renders the old version's files with these patterns before the project has that answer.
_exclude:
  - "{% if (code_review is defined and not code_review) or (git_host is defined and git_host != 'github') %}.github/workflows/code-review.yml{% endif %}"
  - "{% if 'claude' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}CLAUDE.md{% endif %}"
  - "{% if 'claude' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.claude{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/copilot-*.agent.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/plan-executor.agent.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/skills{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts/execute-step.prompt.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/hybrid-*.agent.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/agents/local-implementer.agent.md{% endif %}"
  - "{% if 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts/execute-step-local.prompt.md{% endif %}"
  - "{% if 'copilot' not in (workflow_tools | default(['claude', 'copilot', 'local'])) and 'local' not in (workflow_tools | default(['claude', 'copilot', 'local'])) %}.github/prompts{% endif %}"
  - |-
    {% if stack is defined and not ((uses_node is defined and uses_node) or (uses_node is not defined and stack == 'node')) %}
    /.node-version
    .template/Initialize-Nvs.ps1
    .template/Use-Node.ps1
    .template/use-node.sh
    docs/decisions/project-template/0200-nodejs-comes-from-nvs-and-a-node-version-file.md
    {% endif %}
  - |-
    {% if stack is defined and stack != 'dotnet' %}
    docs/decisions/project-template/0100-warnings-are-errors-in-every-project.md
    docs/decisions/project-template/0101-central-package-management.md
    docs/decisions/project-template/0102-disallowed-apis-are-banned-at-build-time.md
    docs/decisions/project-template/0103-behavior-is-a-service-a-strategy-collection-or-a-mediator.md
    docs/decisions/project-template/0104-no-cross-assembly-internalsvisibleto.md
    docs/decisions/project-template/0105-the-canonical-implementation-is-named-defaultfoo.md
    docs/decisions/project-template/0106-configuration-binds-strictly-and-is-validated-at-startup.md
    docs/decisions/project-template/0107-filtered-reads-push-filtering-to-the-database.md
    docs/decisions/project-template/0108-persisted-documents-are-versioned-and-additive.md
    docs/decisions/project-template/0109-a-lost-concurrency-race-is-a-store-neutral-exception.md
    docs/decisions/project-template/0110-shared-state-is-changed-by-read-modify-write.md
    docs/decisions/project-template/0111-failures-carry-a-machine-readable-code.md
    docs/decisions/project-template/0112-binary-data-uses-spans-pooled-buffers-and-cleared-secrets.md
    docs/decisions/project-template/0113-metrics-have-one-owner-per-signal-and-bounded-dimensions.md
    docs/decisions/project-template/0114-one-activity-source-named-like-its-meter.md
    docs/decisions/project-template/0115-a-host-logs-to-standard-output.md
    docs/decisions/project-template/0116-visibility-starts-at-the-narrowest-that-works.md
    docs/decisions/project-template/0117-one-definition-of-done-gates-every-change.md
    docs/decisions/project-template/0118-the-null-forgiving-operator-is-banned-outside-tests.md
    docs/decisions/project-template/0119-production-refuses-development-only-settings.md
    docs/decisions/project-template/0120-request-delegates-are-generated-at-compile-time.md
