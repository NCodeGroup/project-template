project_name:
  type: str
  help: Project name, used in headings (for example QSO Log Viewer)
  validator: "{% if not project_name.strip() %}Required{% endif %}"

project_description:
  type: str
  help: One-sentence description
  default: ""

stack:
  type: str
  help: Main language or platform
  choices:
    .NET (C#): dotnet
    Python: python
    Node.js or TypeScript: node
    PowerShell: powershell
    Other: other
  default: dotnet

git_host:
  type: str
  help: Where the repository is hosted
  choices:
    GitHub: github
    GitLab: gitlab
  default: github

workflow_tools:
  type: str
  help: The AI tools to set the workflow up for
  multiselect: true
  choices:
    Claude Code: claude
    GitHub Copilot (Copilot Chat and Copilot CLI): copilot
    Hybrid agents on the shack PC's local model (personal; leave out of shared repositories): local
  default: [claude, copilot]
  validator: "{% if not workflow_tools %}Choose at least one tool{% endif %}"

code_review:
  type: bool
  help: "Review pull requests with the NCode Review bot (NCodeGroup/code-review)? Adds a workflow that needs the organization's secrets and a one-time tools/Enable-CodeReview.ps1 run"
  default: false
  when: "{{ git_host == 'github' }}"

nuget_package:
  type: bool
  help: "Publish the projects as NuGet packages: license, README and icon in each package, Source Link, symbol packages"
  default: false
  when: "{{ stack == 'dotnet' }}"

license:
  type: str
  help: "SPDX license expression for the repository and its packages, such as MIT or Apache-2.0, or blank for none; MIT and Apache-2.0 get their LICENSE.txt written"
  default: ""
  validator: "{% if (nuget_package | default(false)) and not license.strip() %}Required for a NuGet package: the SPDX license expression its packages carry, such as MIT or Apache-2.0{% endif %}"

author_name:
  type: str
  help: Author and copyright holder for the license and for .NET assembly and package metadata
  default: NCode Group
  when: "{{ stack == 'dotnet' or license }}"

package_icon:
  type: str
  help: "Package icon: a PNG file at the repository root, or blank for none. NCodeGroup.png is the template's own, written for you"
  default: "{% if author_name == 'NCode Group' %}NCodeGroup.png{% endif %}"
  when: "{{ stack == 'dotnet' and nuget_package }}"
  validator: '{% if "/" in package_icon or "\\" in package_icon %}A file name at the repository root, without a folder{% endif %}'

uses_node:
  type: bool
  help: "Does the repository need Node.js (a Node.js project, or a frontend or tooling in another stack)? Adds .node-version, nvs setup scripts for bash and PowerShell, and the rules for using them"
  default: "{{ stack == 'node' }}"

package_manager:
  type: str
  help: The Node.js package manager, which CI installs dependencies with and the default commands run
  choices:
    npm: npm
    pnpm: pnpm
    Yarn: yarn
    Bun: bun
  default: npm
  when: "{{ stack == 'node' }}"

build_command:
  type: str
  help: Build command, run from the repository root in PowerShell (blank if there is no build step)
  default: >-
    {%- if stack == 'dotnet' -%}dotnet build
    {%- elif stack == 'node' -%}{{ package_manager | default('npm') }} run build
    {%- elif stack == 'powershell' -%}Invoke-ScriptAnalyzer -Path . -Recurse -EnableExit
    {%- endif -%}

test_command:
  type: str
  help: Test command, run from the repository root in PowerShell
  default: >-
    {%- if stack == 'dotnet' -%}dotnet test
    {%- elif stack == 'python' -%}python -m pytest -q
    {%- elif stack == 'node' -%}{{ package_manager | default('npm') }} run test
    {%- elif stack == 'powershell' -%}Invoke-Pester -CI
    {%- endif -%}

# Never asked or recorded: the pre-release line of the AGENTS.md the template writes (ADR-0015). A new project starts
# untracked; Adopt-Project.ps1 answers tracked, since an adopted repository has a history.
pre_release:
  type: str
  when: false
  default: untracked
  validator: "{% if pre_release not in ['tracked', 'untracked'] %}Either tracked or untracked{% endif %}"

project_owned_files:
  type: yaml
  help: "Files the project owns, merged or template-owned, such as [.github/workflows/ci.yml, build/dod.ps1]: updates leave them alone and show the template's changes to them"
  default: []
  # Not asked when the project is created; recorded only when -Data supplies it.
  when: "{{ project_owned_files | default([]) | length > 0 }}"
  validator: "{% if project_owned_files is string %}A list, such as [.github/workflows/ci.yml]{% endif %}"

_message_after_copy: |
  Created {{ project_name }}. Next: open it through the shack PC's VS Code tunnel, review AGENTS.md, and plan the first change with /plan-feature in the Claude Code panel.
  {%- if code_review is defined and code_review %}

  Code review: .github/workflows/code-review.yml reviews each pull request with the NCode Review bot once the repository has the organization's secrets. From a clone of NCodeGroup/code-review, run tools/Enable-CodeReview.ps1 -Repo <the repository's name>. Until then the review job fails.
  {%- endif -%}
